{% extends 'base.html' %}

{% block content %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 0;
    }

    .auth-card {
        width: 100%;
        max-width: 440px;
        background-color: var(--white);
        border: 1px solid var(--border-gray);
        border-radius: var(--border-radius-card);
        padding: 2.5rem 2rem;
        box-shadow: var(--shadow-md);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        background-color: var(--primary-light);
        color: var(--primary);
        border-radius: 14px;
        margin-bottom: 1.5rem;
    }

    .auth-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--charcoal);
        margin-bottom: 0.5rem;
    }

    .auth-header p {
        color: var(--medium-gray);
        font-size: 0.95rem;
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.95rem;
        color: var(--medium-gray);
    }

    .auth-footer a {
        color: var(--primary);
        font-weight: 600;
    }
    
    .auth-footer a:hover {
        color: var(--primary-hover);
        text-decoration: underline;
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5c-2.2 0-4 1.8-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            </div>
            <h1>Create your TruckingPro account</h1>
            <p>Register to submit and track truck requests.</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }} <span style="color: red;">*</span></label>
                    {% if field.errors %}
                        <div style="color: var(--status-cancelled-text); font-size: 0.85rem; margin-bottom: 0.5rem;">
                            {{ field.errors|striptags }}
                        </div>
                    {% endif %}
                    <input type="{% if 'password' in field.name %}password{% elif 'email' in field.name %}email{% else %}text{% endif %}" name="{{ field.name }}" class="form-input" id="{{ field.id_for_label }}" placeholder="Enter your {{ field.label|lower }}" required>
                </div>
            {% endfor %}
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem; font-size: 1rem;">Register</button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="{% url 'login' %}">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
