{% extends 'base.html' %}

{% block content %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 0;
    }

    .auth-card {
        width: 100%;
        max-width: 440px;
        background-color: var(--white);
        border: 1px solid var(--border-gray);
        border-radius: var(--border-radius-card);
        padding: 2.5rem 2rem;
        box-shadow: var(--shadow-md);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        background-color: var(--primary-light);
        color: var(--primary);
        border-radius: 14px;
        margin-bottom: 1.5rem;
    }

    .auth-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--charcoal);
        margin-bottom: 0.5rem;
    }

    .auth-header p {
        color: var(--medium-gray);
        font-size: 0.95rem;
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.95rem;
        color: var(--medium-gray);
    }

    .auth-footer a {
        color: var(--primary);
        font-weight: 600;
    }
    
    .auth-footer a:hover {
        color: var(--primary-hover);
        text-decoration: underline;
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
            </div>
            <h1>Welcome back to TruckingPro Logistics</h1>
            <p>Log in to manage your truck requests.</p>
        </div>
        
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <div class="alert" style="background-color: #fee2e2; color: var(--status-cancelled-text); border: 1px solid #fecaca; padding: 0.8rem; border-radius: var(--border-radius-card); margin-bottom: 1.5rem; font-size: 0.9rem;">
                    Invalid username/email or password. Please try again.
                </div>
            {% endif %}
            
            <div class="form-group">
                <label class="form-label" for="id_username">Username or Email</label>
                <input type="text" name="username" class="form-input" id="id_username" placeholder="Enter your username or email" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <input type="password" name="password" class="form-input" id="id_password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem; font-size: 1rem;">Log In</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
